# Render 一键部署配置（Blueprint）
# 连接 GitHub 仓库后，Render 会自动读取此文件完成部署
# 访问地址：部署完成后直接打开 Render 给的 https://xxx.onrender.com 即可使用，无需单独部署前端
services:
  - type: web
    name: story-blindbox
    runtime: python
    # 从项目根目录运行（main.py 在 backend/，index.html 在根目录）
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false                  # 在 Render 后台手动填入 DeepSeek API Key（不要写进代码）
      - key: BASE_URL
        value: https://api.deepseek.com/v1
      - key: MODEL
        value: deepseek-chat
