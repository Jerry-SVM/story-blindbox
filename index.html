<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 故事盲盒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent2: #bc8cff;
    --grad: linear-gradient(135deg, #58a6ff, #bc8cff);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif SC', serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
    line-height: 1.7;
  }
  .container { max-width: 960px; margin: 0 auto; }

  /* Header */
  header { text-align: center; margin-bottom: 32px; }
  h1 {
    font-size: 2.4rem; font-weight: 700; letter-spacing: 2px;
    background: var(--grad); -webkit-background-clip: text;
    background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--muted); font-size: 1rem; margin-top: 8px; font-weight: 400; }

  /* Card base */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; margin-bottom: 20px;
  }
  .label {
    font-size: 0.95rem; color: var(--muted); margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
  }

  /* Keyword boxes - glassmorphism */
  .keywords { display: flex; gap: 14px; }
  .kw-box {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: rgba(88, 166, 255, 0.06);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(88, 166, 255, 0.25);
    border-radius: 12px; padding: 10px 12px; transition: border-color .2s;
  }
  .kw-box:focus-within { border-color: var(--accent); }
  .kw-box input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: inherit; font-size: 0.95rem;
  }
  .kw-box input::placeholder { color: #6e7681; }
  .dice-btn {
    background: rgba(188, 140, 255, 0.15); border: 1px solid rgba(188, 140, 255, 0.3);
    border-radius: 8px; width: 32px; height: 32px; cursor: pointer;
    font-size: 1rem; transition: transform .15s, background .2s; flex-shrink: 0;
  }
  .dice-btn:hover { background: rgba(188, 140, 255, 0.3); transform: rotate(15deg); }
  .dice-btn:active { transform: rotate(180deg) scale(0.9); }

  /* Style buttons */
  .styles { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .style-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text); padding: 8px 16px; border-radius: 20px;
    cursor: pointer; font-family: inherit; font-size: 0.9rem; transition: all .2s;
  }
  .style-btn:hover { border-color: var(--accent); }
  .style-btn.active {
    border: 1px solid transparent;
    background:
      linear-gradient(var(--card), var(--card)) padding-box,
      var(--grad) border-box;
    color: var(--accent);
  }
  .custom-style {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; color: var(--text);
    font-family: inherit; font-size: 0.9rem; outline: none;
  }
  .custom-style:focus { border-color: var(--accent); }
  .custom-style::placeholder { color: #6e7681; }

  /* Slider */
  .slider-row { display: flex; align-items: center; gap: 16px; }
  input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none; height: 6px;
    border-radius: 3px; background: var(--border); outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
    border-radius: 50%; background: var(--grad); cursor: pointer;
    box-shadow: 0 0 0 4px rgba(88, 166, 255, 0.15);
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px; border: none; border-radius: 50%;
    background: var(--accent); cursor: pointer;
  }
  .word-value {
    min-width: 90px; text-align: right; color: var(--accent);
    font-weight: 700; font-size: 1rem;
  }

  /* Generate button */
  .gen-btn {
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    font-family: inherit; font-size: 1.1rem; font-weight: 700; cursor: pointer;
    background: var(--grad); color: #fff; transition: transform .15s, opacity .2s;
  }
  .gen-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Story area */
  .progress-text {
    color: var(--accent); font-style: italic; margin-bottom: 12px;
    min-height: 24px; animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  .story-text {
    font-size: 1.02rem; line-height: 2; white-space: pre-wrap;
    min-height: 80px;
  }
  .story-text.empty { color: var(--muted); font-style: italic; }
  .cursor {
    display: inline-block; width: 8px; height: 1.1em;
    background: var(--accent); margin-left: 2px; vertical-align: text-bottom;
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  .story-actions { display: flex; gap: 12px; margin-top: 20px; }
  .action-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text); padding: 8px 16px; border-radius: 8px;
    cursor: pointer; font-family: inherit; font-size: 0.9rem; transition: all .2s;
  }
  .action-btn:hover { border-color: var(--accent); background: rgba(88,166,255,0.08); }
  .retry-btn {
    background: rgba(210, 153, 34, 0.15); border-color: rgba(210, 153, 34, 0.4);
    color: #d29922;
  }
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 12px 24px; border-radius: 10px; z-index: 100; font-size: 0.95rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: toastIn .3s;
  }
  @keyframes toastIn { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

  /* 大纲卡片 */
  .outline-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  }
  .outline-item {
    background: rgba(88, 166, 255, 0.06);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(88, 166, 255, 0.3);
    border-radius: 12px; padding: 14px;
    box-shadow: 0 0 12px rgba(88, 166, 255, 0.12); /* 柔光边框 */
    transition: transform .2s, box-shadow .2s;
  }
  .outline-item:hover { transform: translateY(-3px); box-shadow: 0 0 18px rgba(88, 166, 255, 0.25); }
  .outline-num {
    display: inline-block; background: var(--grad); color: #fff;
    width: 22px; height: 22px; line-height: 22px; text-align: center;
    border-radius: 50%; font-size: 0.78rem; margin-bottom: 8px; font-weight: 700;
  }
  .outline-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; color: var(--text); }
  .outline-summary { color: var(--muted); font-size: 0.82rem; line-height: 1.5; }

  /* Mobile */
  @media (max-width: 768px) {
    h1 { font-size: 1.8rem; }
    .keywords { flex-direction: column; }
    .outline-grid { grid-template-columns: repeat(2, 1fr); }
    .card { padding: 18px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📖 故事盲盒</h1>
    <p class="subtitle">输入3个灵感碎片，AI为你编织独一无二的微小说</p>
  </header>

  <!-- 关键词区 -->
  <div class="card">
    <div class="label">🎬 灵感碎片（每个框右侧🎲可随机）</div>
    <div class="keywords">
      <div class="kw-box">
        <input type="text" id="kw1" placeholder="主角/物品，如：魔法画笔">
        <button class="dice-btn" data-target="kw1" title="随机">🎲</button>
      </div>
      <div class="kw-box">
        <input type="text" id="kw2" placeholder="场景/地点，如：云端书店">
        <button class="dice-btn" data-target="kw2" title="随机">🎲</button>
      </div>
      <div class="kw-box">
        <input type="text" id="kw3" placeholder="冲突/情绪，如：迟到的勇气">
        <button class="dice-btn" data-target="kw3" title="随机">🎲</button>
      </div>
    </div>
  </div>

  <!-- 文风区 -->
  <div class="card">
    <div class="label">🎨 文风选择</div>
    <div class="styles">
      <button class="style-btn active" data-style="王家卫式文艺">王家卫式文艺</button>
      <button class="style-btn" data-style="刘慈欣式硬核">刘慈欣式硬核</button>
      <button class="style-btn" data-style="童话治愈风">童话治愈风</button>
    </div>
    <input type="text" class="custom-style" id="customStyle" placeholder="输入其他风格，如：韩寒式冷幽默">
  </div>

  <!-- 字数 -->
  <div class="card">
    <div class="label">📏 字数控制</div>
    <div class="slider-row">
      <input type="range" id="wordSlider" min="300" max="2000" step="100" value="800">
      <span class="word-value"><span id="wordValue">800</span> 字</span>
    </div>
  </div>

  <!-- 生成按钮 -->
  <button class="gen-btn" id="genBtn">✨ 生成故事</button>

  <!-- 大纲展示区 -->
  <div class="card" id="outlineCard" style="display:none; margin-top:20px;">
    <div class="label">🗂 故事大纲</div>
    <div class="outline-grid" id="outlineGrid"></div>
  </div>

  <!-- 故事展示区 -->
  <div class="card" id="storyCard" style="margin-top:20px;">
    <div class="progress-text" id="progressText"></div>
    <div class="story-text empty" id="storyText">这里将出现属于你的故事...</div>
    <div class="story-actions" id="storyActions" style="display:none;">
      <button class="action-btn" id="rerollBtn">🔄 换一种结局</button>
      <button class="action-btn" id="copyBtn">📋 复制全文</button>
    </div>
  </div>
</div>

<script>
/* ============ 预设词库（每个框约 20 个，不放回抽样） ============ */
const WORD_BANK = {
  kw1: ['一只会说话的猫','一个失忆的邮差','一颗坠落的星星','一台老旧的收音机','一个不会笑的小丑','一封寄给未来的信','一只机械蝴蝶','一个会预言的影子','一盏永不熄灭的灯','一颗会流泪的石头','一个倒着走的钟表匠','一本会自己写字的日记','一只迷路的候鸟','一株开在冬天的玫瑰','一个收集回声的老人','一把生锈的银钥匙','一只装着海的玻璃瓶','一个卖梦的旅人','一只折翼的纸鸢','一尊会叹息的雕像'],
  kw2: ['末日的废弃书店','永远下雨的小镇','漂浮在云端的图书馆','时间停滞的车站','深海底的玻璃城市','月光下的游乐园','没有出口的旋转楼梯','黎明前的菜市场','被遗忘的灯塔','屋顶上的花园','午夜的天台','停摆的钟楼','雪山下的客栈','雾中的码头','空无一人的剧场','废墟里的学校','银河边的咖啡馆','悬崖上的灯塔','地下档案馆','破旧的绿皮火车'],
  kw3: ['失去记忆的恐惧','无法兑现的承诺','意外的重逢','对明天的渴望','被原谅的释然','无人知晓的秘密','错过的最后一班车','关于离别的练习','无法说出口的告白','对自由的向往','被误解的孤独','重逢后的尴尬','等待的焦灼','对未知的恐惧','遗憾的回响','迟到的勇气','被遗忘的愤怒','无声的告别','对过去的执念','突如其来的平静']
};
// 每个框的抽取队列（不放回，取空后自动重置）
const drawQueues = { kw1: [], kw2: [], kw3: [] };

/* ============ 后端地址（相对路径，本地与公网自动适配） ============
 * 原理：前后端共用一个域名（FastAPI 直接 serve index.html）
 *   本地 http://localhost:8000/   → 自动请求 http://localhost:8000/api/*
 *   公网 https://xxx.onrender.com → 自动请求 https://xxx.onrender.com/api/*
 * 无需手动修改
 */
const API_BASE = '';

/* ============ 状态 ============ */
let selectedStyle = '王家卫式文艺';
let lastOutline = null;
let fullStory = '';
let chapterStarts = []; // 各章在 fullStory 中的起始偏移，供"换结局"截断用

/* ============ DOM ============ */
const $ = id => document.getElementById(id);
const kw1=$('kw1'), kw2=$('kw2'), kw3=$('kw3');
const customStyle=$('customStyle');
const wordSlider=$('wordSlider'), wordValue=$('wordValue');
const genBtn=$('genBtn');
const storyText=$('storyText'), progressText=$('progressText'), storyActions=$('storyActions');

/* ============ 不放回抽样（Fisher–Yates 洗牌） ============ */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ============ 随机填充（不放回，取空自动重置） ============ */
document.querySelectorAll('.dice-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.target;
    const target = $(key);
    let q = drawQueues[key];
    // 队列空 → 重新洗一份完整词库
    if (q.length === 0) q = drawQueues[key] = shuffle([...WORD_BANK[key]]);
    let word = q.pop();
    // 尽量避免与当前值重复（队列还有就换一个，把原词放回队尾留待下次）
    if (word === target.value && q.length > 0) {
      const alt = q.pop();
      q.push(word);
      word = alt;
    }
    target.value = word;
    target.focus();
  });
});

/* ============ 文风选择 ============ */
document.querySelectorAll('.style-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedStyle = btn.dataset.style;
    customStyle.value = '';
  });
});
// 自定义输入时取消按钮选中
customStyle.addEventListener('input', () => {
  if (customStyle.value.trim()) {
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
    selectedStyle = customStyle.value.trim();
  } else {
    // 恢复默认选中第一个
    const first = document.querySelector('.style-btn');
    if (!document.querySelector('.style-btn.active')) {
      first.classList.add('active');
      selectedStyle = first.dataset.style;
    }
  }
});

/* ============ 字数滑块 ============ */
wordSlider.addEventListener('input', () => { wordValue.textContent = wordSlider.value; });

/* ============ Toast ============ */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(()=>el.remove(),300); }, 2500);
}

/* ============ 自定义文风防呆校验 ============
 * 拦截：纯数字 / 纯标点符号 / 纯空白 / 1-2 个无意义英文字母
 * 放行：elegant、cyberpunk、dark academia 等有语义的词
 */
function isInvalidStyle(s) {
  s = s.trim();
  if (!s) return true;                              // 纯空白
  if (/^\d+$/.test(s)) return true;                 // 纯数字
  if (/^[\p{P}\p{S}\s]+$/u.test(s)) return true;    // 纯标点/符号
  if (/^[a-zA-Z]{1,2}$/.test(s)) return true;       // 1-2 个无意义英文字母
  return false;
}

/* ============ HTML 转义（防止模型输出注入） ============ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
  ));
}

/* ============ 渲染大纲卡片 ============ */
function renderOutline(outline) {
  const card = $('outlineCard');
  const grid = $('outlineGrid');
  const chapters = (outline && outline.chapters) || [];
  if (!chapters.length) { card.style.display = 'none'; return; }
  grid.innerHTML = chapters.map((ch, i) => `
    <div class="outline-item">
      <span class="outline-num">${i + 1}</span>
      <div class="outline-title">${escapeHtml(ch.title || '')}</div>
      <div class="outline-summary">${escapeHtml(ch.summary || '')}</div>
    </div>
  `).join('');
  card.style.display = 'block';
}

/* ============ 接口1：调用后端生成大纲 ============ */
async function generateOutline(keywords, style, wordCount) {
  const resp = await fetch(`${API_BASE}/api/outline`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ keywords, style, wordCount })
  });
  if (!resp.ok) throw new Error(`大纲接口异常：${resp.status}`);
  return await resp.json();
}

/* ============ 接口2：SSE 流式生成故事 ============
 * outline: 大纲 JSON
 * onlyTwist: 是否仅重新生成结局
 * 流式 chunk 逐字追加到 fullStory 并实时渲染
 */
async function generateStory(outline, onlyTwist = false) {
  const resp = await fetch(`${API_BASE}/api/story`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ outline, only_twist: onlyTwist })
  });
  if (!resp.ok) throw new Error(`故事接口异常：${resp.status}`);

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    // SSE 事件以空行（\n\n）分隔
    let sep;
    while ((sep = buffer.indexOf('\n\n')) >= 0) {
      const evt = buffer.slice(0, sep);
      buffer = buffer.slice(sep + 2);
      const line = evt.trim();
      if (!line.startsWith('data:')) continue;
      let data;
      try { data = JSON.parse(line.slice(5).trim()); } catch { continue; }
      if (data.error) throw new Error(data.error);
      if (data.done) return;
      if (data.text) {
        // 记录章节起始偏移（chapter>0），供"换结局"截断
        if (data.chapter && data.chapter > 0) {
          const ci = data.chapter - 1;
          if (chapterStarts[ci] === undefined) chapterStarts[ci] = fullStory.length;
        }
        fullStory += data.text;
        renderStory();
      }
    }
  }
}

/* ============ 渲染故事文本（带光标） ============ */
function renderStory() {
  storyText.classList.remove('empty');
  storyText.innerHTML = fullStory.replace(/\n/g, '<br>') + '<span class="cursor"></span>';
}

/* ============ 进度文字轮播 ============ */
const PROGRESS_MSGS = ['正在构思反转结局...','正在塑造人物对话...','正在润色语言风格...','即将完成✨'];
function startProgress() {
  let idx = 0;
  progressText.textContent = PROGRESS_MSGS[0];
  const timer = setInterval(() => {
    idx = Math.min(idx + 1, PROGRESS_MSGS.length - 1);
    progressText.textContent = PROGRESS_MSGS[idx];
  }, 2000);
  return () => clearInterval(timer);
}

/* ============ 生成主流程 ============ */
let isGenerating = false;
async function handleGenerate() {
  if (isGenerating) return;

  const keywords = [kw1.value.trim(), kw2.value.trim(), kw3.value.trim()];
  if (keywords.some(k => !k)) {
    toast('还差一个灵感碎片哦，填满它或点🎲试试！');
    return;
  }

  // 自定义文风防呆：仅当用户填了自定义文风时校验（预设按钮始终有效）
  const customVal = customStyle.value.trim();
  if (customVal && isInvalidStyle(customVal)) {
    toast('🤔 这个描述AI没看懂，试试输入像「悬疑烧脑」或「elegant」这样的风格词吧！');
    return;
  }

  isGenerating = true;
  genBtn.disabled = true;
  genBtn.textContent = '生成中...';
  storyActions.style.display = 'none';
  $('outlineCard').style.display = 'none'; // 重置上一次的大纲
  storyText.classList.add('empty');
  storyText.textContent = '这里将出现属于你的故事...';
  fullStory = '';
  chapterStarts = [];

  // 进度文字在大纲生成期间轮播，首个故事 chunk 抵达后隐藏
  const stopProgress = startProgress();

  try {
    // 1. 获取大纲
    const outline = await generateOutline(keywords, selectedStyle, parseInt(wordSlider.value));
    lastOutline = outline;
    // 立即展示大纲卡片（在 AI 输出第一个字之前）
    renderOutline(outline);

    // 2. SSE 流式生成故事
    stopProgress();
    progressText.textContent = '';
    storyText.classList.remove('empty');
    storyText.innerHTML = '<span class="cursor"></span>';

    await generateStory(outline, false);
    // 完成后去掉光标
    storyText.innerHTML = fullStory.replace(/\n/g, '<br>');
    storyActions.style.display = 'flex';
  } catch (e) {
    stopProgress();
    progressText.textContent = '';
    $('outlineCard').style.display = 'none'; // 失败时隐藏大纲
    storyText.classList.remove('empty');
    storyText.innerHTML = `故事灵感正在穿越时空，点击重试再讲一次<br>`;
    const retry = document.createElement('button');
    retry.className = 'action-btn retry-btn';
    retry.textContent = '🔁 重试';
    retry.onclick = () => { retry.remove(); handleGenerate(); };
    storyText.appendChild(retry);
  } finally {
    isGenerating = false;
    genBtn.disabled = false;
    genBtn.textContent = '✨ 生成故事';
  }
}

genBtn.addEventListener('click', handleGenerate);

/* ============ 换一种结局（调用后端 only_twist 重新生成结局） ============ */
$('rerollBtn').addEventListener('click', async () => {
  if (!lastOutline || isGenerating) return;
  isGenerating = true;
  storyActions.style.display = 'none';
  genBtn.disabled = true;
  genBtn.textContent = '换结局中...';

  // 截断到最后一个章节起始处，保留前文，丢弃旧结局
  const valid = chapterStarts.filter(o => o !== undefined);
  if (valid.length > 0) {
    const cutAt = valid[valid.length - 1];
    fullStory = fullStory.slice(0, cutAt).replace(/\n+$/, '') + '\n\n';
  }
  renderStory();

  try {
    // only_twist=True：后端只流式返回新结局
    await generateStory(lastOutline, true);
    storyText.innerHTML = fullStory.replace(/\n/g, '<br>');
    storyActions.style.display = 'flex';
  } catch (e) {
    toast('结局生成失败，请重试');
    storyText.innerHTML = fullStory.replace(/\n/g, '<br>');
    storyActions.style.display = 'flex';
  } finally {
    isGenerating = false;
    genBtn.disabled = false;
    genBtn.textContent = '✨ 生成故事';
  }
});

/* ============ 复制全文 ============ */
$('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(fullStory);
    toast('已复制全文到剪贴板 ✓');
  } catch {
    // 兜底
    const ta = document.createElement('textarea');
    ta.value = fullStory; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('已复制全文到剪贴板 ✓');
  }
});
</script>
</body>
